[package]
name = "tether-desktop"
version = "0.3.1"
description = "Native desktop console for the Tether coding agent"
authors = ["Tether"]
edition = "2021"

[lib]
name = "tether_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
