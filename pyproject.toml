[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tether"
version = "0.3.1"
description = "Local-first, model-flexible AI coding agent"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "prompt_toolkit>=3.0",
    "ptterm @ git+https://github.com/prompt-toolkit/ptterm.git@48a590efe502712250ba75effd48f8a0cbdc2518",
    "pygments>=2.0",
    "pypdf>=4.0",
]

[project.optional-dependencies]
bundle = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
]

[project.scripts]
tether = "tether.cli:main"

# The repo root *is* the `tether` package: it has __init__.py and the
# subpackages live as plain subdirectories. Map the package name to "."
# so `pip install -e .` from a fresh clone works without a src/ shim.
[tool.setuptools.package-data]
# Ship built-in skills and the pinned upstream zsh prompt collection.
tether = ["skills_builtin/*/SKILL.md", "skills_builtin/*/*",
          "vendor/oh-my-zsh/LICENSE.txt", "vendor/oh-my-zsh/manifest.json",
          "vendor/oh-my-zsh/themes/*.zsh-theme", "vendor/oh-my-zsh/lib/*.zsh"]

[tool.setuptools]
package-dir = {"tether" = "."}
packages = [
    "tether",
    "tether.agents",
    "tether.core",
    "tether.core.codebase_model",
    "tether.engine",
    "tether.runtime",
    "tether.session",
    "tether.tools",
    "tether.ui",
]
