name: CLI binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "**/*.py"
      - "pyproject.toml"
      - "install.sh"
      - "skills_builtin/**"
      - ".github/workflows/cli-binary.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, ubuntu-22.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install zsh for shell and theme tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python -m pip install '.[bundle,dev]'
      - run: python -m pytest -q
      - run: python scripts/build_binary.py
      - name: Smoke-test installed binary outside the checkout
        run: |
          TETHER_INSTALL_DIR="$RUNNER_TEMP/tether-bin" sh install.sh --binary dist/tether --no-modify-path
          cd "$RUNNER_TEMP"
          export TETHER_CONFIG_DIR="$RUNNER_TEMP/tether-smoke-config"
          export PATH="$RUNNER_TEMP/tether-bin:$PATH"
          tether --version
          tether --help
          tether doctor --json
      - uses: actions/upload-artifact@v4
        with:
          name: tether-${{ matrix.os }}
          path: |
            dist/tether-*.tar.gz
            dist/tether-*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: tether-*
          merge-multiple: true
          path: binaries
      - name: Attach standalone binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" binaries/* --clobber
